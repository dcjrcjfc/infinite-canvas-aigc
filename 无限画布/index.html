<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIGC Workflow - NanoBanana Final Fix</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="viewport">
    <div id="canvas">
        <svg id="svg-layer"><g id="links-container"></g><path id="temp-line" d=""></path></svg>
    </div>
    <div id="selection-marquee" class="selection-marquee"></div>
</div>
<section id="canvas-empty-state" class="canvas-empty-state">
    <div class="empty-headline">
        <span class="empty-badge">✦ 双击</span>
        <span class="empty-text">画布自由生成, 或者看模板</span>
    </div>
</section>

<header class="app-topbar">
    <div class="brand-pill">
        <span class="brand-dot"></span>
        <span class="brand-name">Design Sketch (0408)</span>
    </div>
    <div class="top-actions">
        <button class="top-chip">AI 角色库已上线</button>
        <button class="top-chip top-chip-light">立即探索</button>
        <button class="top-chip">社区</button>
    </div>
</header>

<aside class="agent-panel">
    <div class="agent-header">
        <div class="agent-header-actions">
            <button class="agent-icon-btn" title="新建">＋</button>
            <button class="agent-icon-btn" title="对话">◦</button>
            <button id="agent-collapse-btn" class="agent-icon-btn" title="关闭">×</button>
        </div>
    </div>
    <div class="agent-body">
        <p class="agent-greet">Hi 设计师，今天想一起创作什么？</p>
        <div class="agent-actions">
            <button class="agent-chip">找灵感</button>
            <button class="agent-chip">写角色设定</button>
            <button class="agent-chip">找参考图</button>
        </div>
        <textarea class="agent-input" placeholder="描述想法，或指定节点添加上下文..."></textarea>
        <div class="agent-footer">
            <span class="agent-mode">Pro</span>
            <button id="agent-send-btn" class="agent-send-btn">↑</button>
        </div>
    </div>
</aside>
<button id="agent-fab" class="agent-fab" title="打开 Agent">✺</button>

<div class="canvas-controls" id="canvas-controls">
    <button class="canvas-ctl-btn" id="zoom-out-btn" title="缩小">－</button>
    <input id="zoom-slider" class="zoom-slider" type="range" min="25" max="260" value="100" />
    <button class="canvas-ctl-btn" id="zoom-in-btn" title="放大">＋</button>
    <button class="canvas-ctl-btn" id="zoom-reset-btn" title="重置视图">⌂</button>
    <span id="zoom-label" class="zoom-label">100%</span>
</div>

<aside class="left-rail">
    <button class="rail-main-btn" id="ui-add-btn" title="添加节点" data-tip="添加节点">
        <span class="rail-icon">＋</span>
    </button>
    <div class="rail-divider"></div>
    <button class="rail-btn" id="rail-history-btn" title="历史" data-tip="历史">
        <span class="rail-icon">⟲</span>
    </button>
    <button class="rail-btn" id="rail-editor-btn" title="图片编辑器" data-tip="图片编辑器">
        <span class="rail-icon">✂</span>
    </button>
    <button class="rail-btn" id="rail-profile-btn" title="个人信息" data-tip="个人信息">
        <span class="rail-icon">◉</span>
    </button>
</aside>

<div id="rail-history-panel" class="rail-popup-panel">
    <div class="rail-popup-title">历史</div>
    <div class="history-toolbar">
        <select id="history-filter" class="history-filter" aria-label="历史筛选">
            <option value="all">全部</option>
            <option value="node">节点</option>
            <option value="link">连线</option>
            <option value="edit">编辑</option>
            <option value="upload">上传</option>
            <option value="generate">生成</option>
            <option value="agent">Agent</option>
        </select>
    </div>
    <div class="rail-popup-actions history-actions">
        <button id="history-undo-btn" class="rail-mini-btn" type="button">撤销</button>
        <button id="history-redo-btn" class="rail-mini-btn" type="button">重做</button>
        <button id="history-clear-btn" class="rail-mini-btn" type="button">清空</button>
    </div>
    <div id="history-list" class="history-list"></div>
</div>

<div id="rail-editor-panel" class="rail-popup-panel">
    <div class="rail-popup-title">图片编辑器</div>
    <div class="editor-grid">
        <label class="editor-row">亮度 <input id="edit-brightness" type="range" min="40" max="180" value="100"></label>
        <label class="editor-row">对比度 <input id="edit-contrast" type="range" min="40" max="180" value="100"></label>
        <label class="editor-row">饱和度 <input id="edit-saturate" type="range" min="0" max="200" value="100"></label>
    </div>
    <div class="rail-popup-actions">
        <button id="editor-rotate-btn" class="rail-mini-btn" type="button">旋转90°</button>
        <button id="editor-mirror-btn" class="rail-mini-btn" type="button">镜像</button>
        <button id="editor-reset-btn" class="rail-mini-btn" type="button">重置</button>
        <button id="editor-apply-btn" class="rail-mini-btn" type="button">应用</button>
    </div>
    <div class="rail-popup-note">先选中一个图片节点再应用参数</div>
</div>

<div id="rail-profile-menu" class="profile-menu">
    <div class="profile-head">
        <div class="profile-avatar">X</div>
        <div class="profile-meta">
            <div class="profile-name">xxiong</div>
            <div class="profile-email">13719103923tx@gmail.com</div>
        </div>
    </div>
    <button id="profile-notify-btn" class="profile-item" type="button">🔔 我的通知</button>
    <button id="profile-home-btn" class="profile-item" type="button">👤 个人主页</button>
    <button id="profile-account-btn" class="profile-item" type="button">⚙ 账户管理</button>
    <div class="profile-divider"></div>
    <button id="profile-tutorial-btn" class="profile-item" type="button">❔ 使用教程</button>
    <button id="profile-logout-btn" class="profile-item" type="button">↪ 登出账号</button>
</div>

<div id="nodeMenu" class="node-menu">
    <div class="menu-section-title">添加节点</div>
    <div class="menu-item" data-type="text"><div class="icon-box">≡</div><div class="label">文本节点</div></div>
    <div class="menu-item" data-type="image"><div class="icon-box">🖼️</div><div class="label">图片节点</div></div>
    <div class="menu-item" data-type="video"><div class="icon-box">🎬</div><div class="label">视频节点</div></div>
    <div class="menu-section-title">添加资源</div>
    <div class="menu-item" id="global-upload-btn"><div class="icon-box">↑</div><div class="label">上传</div></div>
</div>

<input type="file" id="file-input">
<div id="toast" class="toast"></div>

<script src="./script.js"></script>
</body>
</html>
