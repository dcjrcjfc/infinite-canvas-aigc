<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AIGC Workflow - NanoBanana Final Fix</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="viewport">
    <div id="canvas">
        <svg id="svg-layer"><g id="links-container"></g><path id="temp-line" d=""></path></svg>
    </div>
</div>
<section id="canvas-empty-state" class="canvas-empty-state">
    <div class="empty-headline">
        <span class="empty-badge">✦ 双击</span>
        <span class="empty-text">画布自由生成, 或者看模板</span>
    </div>
    <div class="empty-chip-row">
        <button class="empty-chip" type="button">▣ 文字生视频</button>
        <button class="empty-chip" type="button">▨ 图片换背景</button>
        <button class="empty-chip" type="button">✧ 音频生成视频</button>
        <button class="empty-chip" type="button">♫ 音频生视频</button>
        <button class="empty-chip" type="button">◎ 文字生 3D 世界</button>
        <button class="empty-chip" type="button">▤ 模板</button>
    </div>
</section>

<header class="app-topbar">
    <div class="brand-pill">
        <span class="brand-dot"></span>
        <span class="brand-name">Design Sketch (0408)</span>
    </div>
    <div class="top-actions">
        <button class="top-chip">AI 角色库已上线</button>
        <button class="top-chip top-chip-light">立即探索</button>
        <button class="top-chip">社区</button>
    </div>
</header>

<aside class="agent-panel">
    <div class="agent-header">
        <div class="agent-header-actions">
            <button class="agent-icon-btn" title="新建">＋</button>
            <button class="agent-icon-btn" title="对话">◦</button>
            <button id="agent-collapse-btn" class="agent-icon-btn" title="关闭">×</button>
        </div>
    </div>
    <div class="agent-body">
        <p class="agent-greet">Hi 设计师，今天想一起创作什么？</p>
        <div class="agent-actions">
            <button class="agent-chip">找灵感</button>
            <button class="agent-chip">写角色设定</button>
            <button class="agent-chip">找参考图</button>
        </div>
        <textarea class="agent-input" placeholder="描述想法，或指定节点添加上下文..."></textarea>
        <div class="agent-footer">
            <span class="agent-mode">Pro</span>
            <button id="agent-send-btn" class="agent-send-btn">↑</button>
        </div>
    </div>
</aside>
<button id="agent-fab" class="agent-fab" title="打开 Agent">✺</button>

<div class="canvas-controls" id="canvas-controls">
    <button class="canvas-ctl-btn" id="zoom-out-btn" title="缩小">－</button>
    <input id="zoom-slider" class="zoom-slider" type="range" min="25" max="260" value="100" />
    <button class="canvas-ctl-btn" id="zoom-in-btn" title="放大">＋</button>
    <button class="canvas-ctl-btn" id="zoom-reset-btn" title="重置视图">⌂</button>
    <span id="zoom-label" class="zoom-label">100%</span>
</div>

<aside class="left-rail">
    <button class="rail-main-btn" id="ui-add-btn" title="添加节点" data-tip="添加节点">
        <span class="rail-icon">＋</span>
    </button>
    <div class="rail-divider"></div>
    <button class="rail-btn" id="rail-focus-btn" title="回到画布中心" data-tip="回到中心">
        <span class="rail-icon">◎</span>
    </button>
    <button class="rail-btn" id="rail-reset-btn" title="重置视图" data-tip="重置视图">
        <span class="rail-icon">⌂</span>
    </button>
    <button class="rail-btn" id="rail-agent-btn" title="收起/展开 Agent" data-tip="切换 Agent">
        <span class="rail-icon">◨</span>
    </button>
</aside>

<div id="nodeMenu" class="node-menu">
    <div class="menu-section-title">添加节点</div>
    <div class="menu-item" data-type="text"><div class="icon-box">≡</div><div class="label">文本节点</div></div>
    <div class="menu-item" data-type="image"><div class="icon-box">🖼️</div><div class="label">图片节点</div></div>
    <div class="menu-item" data-type="video"><div class="icon-box">🎬</div><div class="label">视频节点</div></div>
    <div class="menu-section-title">添加资源</div>
    <div class="menu-item" id="global-upload-btn"><div class="icon-box">↑</div><div class="label">上传</div></div>
</div>

<input type="file" id="file-input">

<script src="./script.js"></script>
</body>
</html>
